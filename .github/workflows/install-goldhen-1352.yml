name: Install GoldHEN 13.52 binaries
on:
  push:
    paths:
      - ".github/workflows/install-goldhen-1352.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 13.52 payload and patch
        run: |
          mkdir -p 1352/patches
          curl -L --fail -o 1352/payload2.bin https://raw.githubusercontent.com/raw13g/raw13g.github.io/e1a31790214a114a84ce5cd48d93b4c64cf44806/payload2.bin
          cp 1352/payload2.bin 1352/goldhen.bin
          curl -L --fail -o 1352/patches/1302.bin https://raw.githubusercontent.com/raw13g/raw13g.github.io/e1a31790214a114a84ce5cd48d93b4c64cf44806/patches/1302.bin
          curl -L --fail -o 1352/patches/1350.bin https://raw.githubusercontent.com/raw13g/raw13g.github.io/e1a31790214a114a84ce5cd48d93b4c64cf44806/patches/1350.bin
          curl -L --fail -o 1352/patches/1352.bin https://raw.githubusercontent.com/raw13g/raw13g.github.io/e1a31790214a114a84ce5cd48d93b4c64cf44806/patches/1352.bin
          test -s 1352/goldhen.bin
          test -s 1352/patches/1352.bin
      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1352/payload2.bin 1352/goldhen.bin 1352/patches
          git diff --cached --quiet || git commit -m "Add GoldHEN 13.52 binary payloads"
          git push
