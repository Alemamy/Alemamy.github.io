<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoldHEN 13.52</title>
<style>
html,body{margin:0;padding:0;min-height:100%;background:#0b0d10;color:#c8ced8;font:15px/1.45 "Segoe UI",system-ui,sans-serif}
#brand{text-align:center;padding:12px 10px;background:#0e1116;border-bottom:1px solid #1e2732}
#brand b{font-size:16px;font-weight:700;letter-spacing:.08em;color:#e6ebf2}
#spin{position:fixed;top:calc(50% + 20px);left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:4px solid #1e2732;border-top-color:#7fd0a0;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#msg{position:fixed;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-size:16px;display:none}
#wrap{padding:0}#state,#out{display:none}
body.done #spin,body.fail #spin{display:none}body.fail #msg{display:block}
body.log #spin,body.log #msg{display:none}
body.log #wrap{padding:14px 18px}
body.log #state{display:block;font-size:22px;font-weight:700;margin:0 0 8px}
body.log #out{display:block;white-space:pre-wrap;font:12px/1.45 Consolas,monospace;background:#11151b;border:1px solid #1e2732;border-radius:5px;padding:10px 12px;height:calc(100vh - 100px);overflow-y:auto}
</style>
</head>
<body>
<div id="brand"><b>GoldHEN 13.52 — Auto</b></div>
<div id="spin"></div>
<div id="msg">أعد تشغيل الجهاز وحاول مرة أخرى</div>
<div id="wrap"><div id="state"></div><div id="out"></div></div>
<script type="module">
import "./jb.js?v=12";
</script>
</body>
</html>
